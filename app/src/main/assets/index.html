<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050913">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hunter System">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>html{background:#050913}body{margin:0}</style>
<title>Hunter System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Layout: sticky system header and tab strip over one centred column of square, bracket-cornered panels.
     The only glowing element is the level numeral; everything else stays quiet. Committed dark single theme. */
  --void:#050913;
  --panel:#0a1426;
  --panel2:#0e1c34;
  --line:#1b3c69;
  --glow:#4cb4ff;
  --ink:#dbe9ff;
  --mute:#8aa0c2;
  --good:#46e0a0;
  --warn:#f5c04a;
  --crit:#ff6b7a;
  --viol:#a48cff;
  --f-display:'Chakra Petch','Rajdhani',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--void);
  background-image:
    radial-gradient(900px 420px at 50% -140px,rgba(76,180,255,.16),transparent 70%),
    linear-gradient(rgba(76,180,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(76,180,255,.035) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px;
  color:var(--ink);
  font:15px/1.5 var(--f-body);
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--void);z-index:30}
.wrap{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--mute)}
b{font-weight:600}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--void) 88%,transparent);padding:12px 0 4px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.logo{font:700 20px/1 var(--f-display);letter-spacing:.28em;color:#fff;text-shadow:0 0 14px rgba(76,180,255,.55)}
.sync{font:500 11px var(--f-mono);color:var(--mute)}
.clockrow{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:6px}
.clockrow #clock{color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:1px solid var(--line);padding:8px 16px;font:600 12px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);cursor:pointer;min-height:40px}
.tab:hover{color:var(--ink);border-color:var(--glow)}
.tab[aria-current="page"]{color:#04101f;background:var(--glow);border-color:var(--glow)}

/* panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:0 14px;align-items:start}
.panel{position:relative;margin-top:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(14,28,52,.9),rgba(10,20,38,.94));box-shadow:0 10px 30px rgba(0,0,0,.35)}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--glow);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.panel.pen{border-color:#6b2a36}
.panel.pen::before,.panel.pen::after{border-color:var(--crit)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
.pt{font:600 12px/1.2 var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--glow)}
.pen .pt{color:var(--crit)}
.pb{padding:14px;min-width:0}
.sysbox{margin-top:14px;border:1px solid var(--glow);outline:1px solid rgba(76,180,255,.35);outline-offset:3px;background:rgba(8,18,36,.92);padding:12px 14px}
.sysbox.crit{border-color:var(--crit);outline-color:rgba(255,107,122,.35)}
.sysbox.good{border-color:var(--good);outline-color:rgba(70,224,160,.35)}
.sysbox.warn{border-color:var(--warn);outline-color:rgba(245,192,74,.35)}
.sysh{font:600 11px var(--f-display);letter-spacing:.32em;color:var(--glow);margin-bottom:4px}
.sysbox.crit .sysh{color:var(--crit)}.sysbox.good .sysh{color:var(--good)}.sysbox.warn .sysh{color:var(--warn)}
.sysbox p{margin:0}
.sysbox .row{margin-top:10px}

/* status */
.idrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lv{display:flex;flex-direction:column;align-items:center;min-width:92px}
.lvl{font:700 68px/1 var(--f-display);color:#fff;text-shadow:0 0 20px var(--glow),0 0 3px var(--glow)}
.lvt{font:600 11px var(--f-display);letter-spacing:.3em;color:var(--glow)}
.idinfo{flex:1 1 200px;min-width:0}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin:12px 0 0}
.kv div{min-width:0}
.kv dt{font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.kv dd{margin:0;font:600 16px var(--f-display);overflow-wrap:anywhere}
.kv .rank{font-size:22px;color:var(--glow)}
.lab{display:block;font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.bar{height:10px;background:#071022;border:1px solid var(--line);position:relative;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2a7fd0,var(--glow));transition:width .4s}
.bar.good i{background:linear-gradient(90deg,#1f9b6c,var(--good))}
.bar.crit i{background:linear-gradient(90deg,#b23a49,var(--crit))}
.prog{display:flex;align-items:center;gap:12px;margin-top:12px}
.stat{display:grid;grid-template-columns:44px 1fr 34px;gap:10px;align-items:center;margin-top:12px}
.stat .ab{font:700 14px var(--f-display);letter-spacing:.1em}
.stat .nm{font:400 12px var(--f-body);color:var(--mute);display:block;letter-spacing:0}
.stat .v{font:600 16px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini div{border:1px solid var(--line);padding:8px 10px;background:#071022}
.mini .n{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.mini .l{font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase}

/* forms and buttons */
.inp,.ta,.sel{width:100%;background:#071022;border:1px solid var(--line);color:var(--ink);padding:9px 10px;min-height:40px}
.ta{min-height:76px;resize:vertical}
.btn{font:600 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;background:transparent;border:1px solid var(--glow);color:var(--ink);padding:9px 16px;min-height:40px;cursor:pointer}
.btn:hover{background:rgba(76,180,255,.14)}
.btn.primary{background:var(--glow);color:#04101f}
.btn.primary:hover{background:#7cc8ff}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.danger:hover{background:rgba(255,107,122,.14)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 10px;min-height:32px;font-size:11px}
.lnk{background:none;border:0;color:var(--mute);font:500 11px var(--f-mono);text-decoration:underline;cursor:pointer;padding:4px 0}
.lnk:hover{color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.segs{display:inline-flex;border:1px solid var(--line)}
.seg{background:transparent;border:0;padding:8px 14px;font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);cursor:pointer;min-height:38px}
.seg.on{background:var(--glow);color:#04101f}
.hint{color:var(--mute);font-size:13px;margin:10px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font:500 11px var(--f-mono);border:1px solid var(--line);padding:2px 7px;color:var(--mute)}
.chip.now{border-color:var(--glow);color:var(--glow)}
.chip.good{border-color:var(--good);color:var(--good)}
.chip.crit{border-color:var(--crit);color:var(--crit)}
.chip.warn{border-color:var(--warn);color:var(--warn)}

/* quests */
.qlist{display:grid;gap:8px;margin-top:12px}
.qrow{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);background:#071022;padding:10px 12px}
.qrow.now{box-shadow:inset 0 0 0 1px var(--glow)}
.qrow.done{opacity:.62}
.qrow.done .qt{text-decoration:line-through;text-decoration-color:var(--mute)}
.qrow.dim{border-style:dashed}
.chk{width:30px;height:30px;border:2px solid var(--glow);background:transparent;color:#04101f;font:700 16px/1 var(--f-display);cursor:pointer;padding:0}
.qrow.done .chk{background:var(--good);border-color:var(--good)}
.qmain{min-width:0}
.qt{font:600 15px var(--f-display);letter-spacing:.04em}
.qd{color:var(--mute);font-size:13px;margin-top:2px}
.qx{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font:500 12px var(--f-mono);color:var(--glow);white-space:nowrap}
.sub{font:600 11px var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--mute);margin:16px 0 0}
.big{font:700 44px/1 var(--f-mono);letter-spacing:.04em;font-variant-numeric:tabular-nums;color:#fff}

/* goals, events, log */
.card{border:1px solid var(--line);background:#071022;padding:12px;margin-top:10px}
.card h3{margin:0;font:600 16px var(--f-display);letter-spacing:.04em;overflow-wrap:anywhere}
.card p{margin:4px 0 0;color:var(--mute);font-size:14px}
.ms{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;margin-top:8px}
.ms .chk{width:24px;height:24px;font-size:13px}
.ms.done span{color:var(--mute);text-decoration:line-through}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid rgba(27,60,105,.6);font-size:14px}
.log time{font:400 11px var(--f-mono);color:var(--mute);padding-top:2px}

/* mind */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{background:#071022;border:1px solid var(--line);min-height:42px;font:600 16px var(--f-display);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--glow);color:#04101f;border-color:var(--glow)}
.scale-l{display:flex;justify-content:space-between;font:400 11px var(--f-mono);color:var(--mute);margin-top:4px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tagbtn{background:transparent;border:1px solid var(--line);padding:6px 12px;font:500 12px var(--f-mono);cursor:pointer;color:var(--mute);min-height:34px}
.tagbtn[aria-pressed="true"]{border-color:var(--glow);color:var(--glow);background:rgba(76,180,255,.12)}
.chart{width:100%;height:auto;display:block}
.chart text{font:400 10px var(--f-mono);fill:var(--mute)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .s-m{stroke:var(--glow);fill:var(--glow)}
.chart .s-e{stroke:var(--warn);fill:var(--warn)}
.chart .s-s{stroke:var(--viol);fill:var(--viol)}
.chart path{fill:none;stroke-width:2;stroke-linejoin:round}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:8px;font:400 12px var(--f-mono);color:var(--mute)}
.legend svg{width:30px;height:8px;vertical-align:middle;margin-right:6px}
.orbwrap{display:grid;place-items:center;padding:18px 0 8px;min-height:230px}
.orb{width:150px;height:150px;border-radius:50%;border:2px solid var(--glow);box-shadow:0 0 28px rgba(76,180,255,.35),inset 0 0 24px rgba(76,180,255,.2);transform:scale(.55);transition:transform 4s ease-in-out;display:grid;place-items:center;text-align:center}
.orb .ol{font:600 14px var(--f-display);letter-spacing:.2em;text-transform:uppercase}
.orb .oc{font:500 22px var(--f-mono);font-variant-numeric:tabular-nums}
.gr{display:grid;gap:8px;margin-top:10px}
.gr label{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.gr input{width:20px;height:20px;accent-color:var(--glow)}

/* overlays */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:rgba(6,14,28,.96);border:1px solid var(--glow);padding:10px 14px;font-size:14px;z-index:40;box-shadow:0 0 24px rgba(76,180,255,.3)}
.toast .sysh{display:inline;margin-right:8px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,6,14,.82);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .panel{margin:0;max-width:420px;width:100%}
.modal .lvl{font-size:88px}
.center{text-align:center}
.chk.st{display:inline-grid;place-items:center;cursor:default}
.chk.off{border-color:var(--line)}
.qrow.m-active{box-shadow:inset 0 0 0 1px var(--glow)}
.qrow.m-done{opacity:.7}
.qrow.m-locked{opacity:.78}
.qrow.m-missed{opacity:.5;border-style:dashed}
.card.sug{border-color:var(--glow);box-shadow:inset 0 0 0 1px var(--glow)}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(94vw,520px);z-index:45;background:rgba(6,14,28,.97);border:1px solid var(--glow);outline:1px solid rgba(76,180,255,.4);outline-offset:3px;padding:12px 14px;box-shadow:0 0 30px rgba(76,180,255,.45);animation:pop .35s ease-out}
.banner p{margin:4px 0 10px;color:var(--ink)}
@keyframes pop{from{transform:translateX(-50%) translateY(-24px);opacity:0}to{transform:translateX(-50%);opacity:1}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
.foot{margin-top:26px;color:var(--mute);font-size:12px}
.foot a,.pb a{color:var(--glow)}
@media (max-width:520px){
  .qrow{grid-template-columns:30px 1fr}
  .qx{grid-column:2;flex-direction:row;align-items:center;gap:12px}
  .log li{grid-template-columns:1fr}
  .big{font-size:38px}
}
@media (prefers-reduced-motion:reduce){
  .orb{transition:none}
  .bar i{transition:none}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo">HUNTER SYSTEM</span><span class="sync" id="sync">Saved on this device</span></div>
    <div class="clockrow"><span id="clock" class="mono"></span><span id="dateTxt" class="mono"></span><span class="mono">Day resets in <b id="resetIn"></b></span></div>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-act="tab" data-v="status">Status</button>
      <button class="tab" data-act="tab" data-v="missions">Missions</button>
      <button class="tab" data-act="tab" data-v="quests">Quests</button>
      <button class="tab" data-act="tab" data-v="raids">Raids</button>
      <button class="tab" data-act="tab" data-v="skills">Skills</button>
      <button class="tab" data-act="tab" data-v="special">Special</button>
      <button class="tab" data-act="tab" data-v="gates">Gates</button>
      <button class="tab" data-act="tab" data-v="events">Events</button>
      <button class="tab" data-act="tab" data-v="mind">Mind</button>
      <button class="tab" data-act="tab" data-v="hall">Hall</button>
    </nav>
  </header>
  <main id="app"></main>
  <p class="foot">A game-style tracker for habits, goals and mood. It is a self-improvement tool, not medical care or a substitute for professional support.</p>
</div>
<div id="banner" class="banner" role="alert" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="modal"></div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var pad=function(n){return String(n).padStart(2,'0')};
var dkey=function(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var addDays=function(k,n){var p=k.split('-').map(Number);return dkey(new Date(p[0],p[1]-1,p[2]+n))};
var diffDays=function(a,b){var pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((new Date(pb[0],pb[1]-1,pb[2])-new Date(pa[0],pa[1]-1,pa[2]))/864e5)};
var fmtT=function(t){return new Date(t).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})};
var pick=function(a){return a[Math.floor(Math.random()*a.length)]};

/* ---------- game data ---------- */
var STAT={str:{ab:'STR',n:'Body'},vit:{ab:'VIT',n:'Recovery'},agi:{ab:'AGI',n:'Discipline'},int:{ab:'INT',n:'Focus'},sen:{ab:'SEN',n:'Awareness'}};
var WIN={am:'Morning',day:'Daytime',pm:'Evening',any:'Anytime'};
var CATSTAT={Mind:'sen',Body:'str',Skill:'int',Life:'agi'};
var DEFAULT_QUESTS=[
  {id:'q_breathe',title:'Breathing Protocol',desc:'Two minutes of slow breathing. The Safe Room in Mind can guide you.',stat:'sen',xp:15,tier:'min',w:'am'},
  {id:'q_move',title:'Light Movement',desc:'Ten minutes of walking or stretching. Outside if you can.',stat:'str',xp:20,tier:'min',w:'am'},
  {id:'q_fuel',title:'Hydrate and Fuel',desc:'Drink water and eat a real meal. The body is the base stat.',stat:'vit',xp:15,tier:'min',w:'day'},
  {id:'q_focus',title:'Focus Dungeon',desc:'25 minutes of deep work or study. The timer on this page counts it.',stat:'int',xp:30,tier:'core',w:'day'},
  {id:'q_journal',title:'Mind Log',desc:'Write three lines: how I feel, what I need, one thing that went okay.',stat:'sen',xp:25,tier:'core',w:'pm'},
  {id:'q_sleep',title:'Sleep Gate',desc:'Start winding down on time. Screens off 30 minutes before bed.',stat:'agi',xp:25,tier:'core',w:'pm'},
  {id:'q_train',title:'Physical Training',desc:'20 to 30 minutes of exercise you can repeat tomorrow.',stat:'str',xp:30,tier:'bonus',w:'day'},
  {id:'q_ally',title:'Ally Contact',desc:'Talk or message with one person. Connection counts as training.',stat:'sen',xp:20,tier:'bonus',w:'any'},
  {id:'q_skill',title:'Skill Practice',desc:'15 minutes on a skill you want to grow.',stat:'int',xp:20,tier:'bonus',w:'any'},
  {id:'q_tidy',title:'Clear the Room',desc:'Reset one small space so tomorrow starts easier.',stat:'agi',xp:15,tier:'bonus',w:'pm'}
];
var PEN_POOL=[
  {title:'Reset Walk',desc:'Walk for 10 minutes, indoors or out. Slow is fine.'},
  {title:'Clear the Deck',desc:'Tidy one surface for 5 minutes. Stop when the time is up.'},
  {title:'Honest Debrief',desc:'Write three sentences: what got in the way, what you needed, what would help tomorrow. No blame.'},
  {title:'Fuel Up',desc:'Drink a full glass of water and eat something with protein.'},
  {title:'Reach Out',desc:'Send one message to someone you trust. Anything counts.'}
];
var EVENT_POOL=[
  {kind:'quest',title:'Hidden Quest: Daylight',desc:'Step outside for 10 minutes. No scrolling while you do.',xp:25,stat:'vit'},
  {kind:'quest',title:'Emergency Quest: Shoulder Reset',desc:'Stand up and do 60 seconds of slow neck and shoulder rolls.',xp:15,stat:'str'},
  {kind:'buff',title:'Bonus Dungeon',desc:'All XP you earn for the rest of today is multiplied by 1.5.',mult:1.5},
  {kind:'quest',title:'Ally Quest: Thank You',desc:'Send one person a short message thanking them for something specific.',xp:25,stat:'sen'},
  {kind:'quest',title:'Name the Thought',desc:'Write down the loudest worry in your head, then one kinder way to say it.',xp:30,stat:'sen'},
  {kind:'quest',title:'Mana Spring',desc:'Take three slow breaths with a long exhale, then drink a glass of water.',xp:15,stat:'sen'},
  {kind:'quest',title:'Gate Appears: One Surface',desc:'Pick one surface (desk, table, sink) and clear it in 5 minutes.',xp:20,stat:'agi'},

var dbDoc=null,saving=false,dirty=false,saveTimer=null;
function setSync(t){var e=$('#sync');if(e)e.textContent=t}
function save(){

function flush(){
  if(!dbDoc||saving||!dirty)return;
  saving=true;dirty=false;
  dbDoc.set(JSON.parse(JSON.stringify(S))).then(function(){setSync('Synced to your account')},function(){setSync('Saved on this device')}).then(function(){saving=false;if(dirty)flush()});
}
function initDb(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];
      if(!db||!user)return;
      return user.id().then(function(id){
        if(!id)return;
        var ref=db.collection('data/users/'+id).doc('system');
        var to=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},10000)});
        return Promise.race([ref.get(),to]).then(function(snap){
          var pushLocal=true;
          if(snap.exists){
            var remote=snap.data();
            if(remote&&remote.v===1&&(remote.updatedAt||0)>(S.updatedAt||0)){
              S=normalize(remote);pushLocal=false;
              try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
            }
          }
          dbDoc=ref;setSync('Synced to your account');
          boot();
          if(pushLocal){dirty=true;flush()}
        });
      });
    }).catch(function(){setSync('Saved on this device')});
  }catch(e){}
}

/* ---------- levels ---------- */
function need(L){return 100+25*(L-1)}
function levelInfo(xp){var L=1,rem=xp;while(rem>=need(L)){rem-=need(L);L++}return {L:L,rem:rem,need:need(L)}}
function rankOf(L){var r='E';RANKS.forEach(function(x){if(L>=x.L)r=x.r});return r}
function titleOf(){
  if(S.streak>=14)return 'Unbroken';
  if(S.streak>=7)return 'Steadfast';
  if(S.checkins.length>=14)return 'Self-Aware';
  if(levelInfo(S.xp).L>=5)return 'Awakened';
  return 'Newly Awakened';
}
function statVal(k){return 10+Math.floor((S.sxp[k]||0)/15)}
function multNow(){return (S.buff&&S.buff.date===dkey())?S.buff.mult:1}

function log(m){S.log.unshift({t:Date.now(),m:m});if(S.log.length>120)S.log.length=120}
function toast(m){
  var t=$('#toast');t.innerHTML='<span class="sysh">SYSTEM</span>'+esc(m);t.hidden=false;
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},3600);
}
function gain(xp,stat,noBoss){
  var amt=Math.round(xp*multNow()),b=levelInfo(S.xp).L;
  S.xp+=amt;if(stat)S.sxp[stat]=(S.sxp[stat]||0)+amt;dayXp(amt,stat);
  var a=levelInfo(S.xp).L;
  if(a>b){
    var rb=rankOf(b),ra=rankOf(a);
    UI.modal={from:b,to:a,rank:ra!==rb?ra:null};
    log('Level up. You reached level '+a+(ra!==rb?' and rank '+ra:'')+'.');
  }
  if(!noBoss&&amt>0)hitBoss(amt,stat);
  return amt;
}
function loseXp(amt,stat){
  S.xp=Math.max(0,S.xp-amt);if(stat)S.sxp[stat]=Math.max(0,(S.sxp[stat]||0)-amt);dayXp(-amt,stat);
  if(S.boss&&S.boss.status==='alive')S.boss.hp=Math.min(S.boss.max,S.boss.hp+amt);
}
function toolAward(xp,label){
  var d=dkey();if(S.toolDay.date!==d)S.toolDay={date:d,n:0};
  if(S.toolDay.n<3){S.toolDay.n++;var a=gain(xp,'sen');log(label+' complete. +'+a+' XP.');toast(label+' complete. +'+a+' XP');return a}
  log(label+' complete. The daily XP cap for practices is reached; the practice still counts.');
  toast(label+' complete. XP cap for today reached, well done anyway.');return 0;
}

function isDone(id){var d=S.done[dkey()];return !!(d&&d[id]!=null)}
function reqQuests(){return S.quests.filter(function(q){return !q.hidden&&(q.tier==='min'||(!S.lowMode&&q.tier==='core'))})}
function winNow(){var h=new Date().getHours();return h<12?'am':h<18?'day':'pm'}
function openPenalty(){return S.penalties.filter(function(p){return p.status==='open'})[0]||null}
function recheck(){
  var d=dkey(),req=reqQuests(),all=req.length>0&&req.every(function(q){return isDone(q.id)});
  if(all&&!S.dayClear[d]){
    S.streak++;S.best=Math.max(S.best,S.streak);
    S.dayClear[d]=gain(20,'agi');
    log('Daily quests cleared. Streak: '+S.streak+'. +'+S.dayClear[d]+' XP.');
    toast('Daily quests cleared. Streak '+S.streak+'.');
    if(S.streak%7===0&&S.passes<3){S.passes++;log('Recovery Pass earned.');}
  }else if(!all&&S.dayClear[d]){
    loseXp(S.dayClear[d],'agi');delete S.dayClear[d];S.streak=Math.max(0,S.streak-1);
  }
}
function toggleQuest(id){
  var d=dkey(),q=S.quests.find(function(x){return x.id===id});if(!q)return;
  S.done[d]=S.done[d]||{};
  if(S.done[d][id]!=null){var amt=S.done[d][id];delete S.done[d][id];loseXp(amt,q.stat)}
  else{var g=gain(q.xp,q.stat);S.done[d][id]=g;log('Quest complete: '+q.title+'. +'+g+' XP.');toast(q.title+' complete. +'+g+' XP')}
  recheck();save();render();
}
function evaluate(){
  var today=dkey(),d=addDays(S.lastEval,1);
  if(diffDays(S.lastEval,today)>15)d=addDays(today,-14);
  var missed=0,lastMissed=null;
  while(d<today){if(!S.dayClear[d]){missed++;lastMissed=d}d=addDays(d,1)}
  if(missed>0){
    var covered=Math.min(S.passes,missed);S.passes-=covered;
    var rem=missed-covered;
    if(covered>0)log('Recovery Pass used on '+covered+' missed day'+(covered>1?'s':'')+'. Streak protected.');
    if(rem>0){
      S.streak=0;
      if(!openPenalty()){
        var p=pick(PEN_POOL);
        S.penalties.unshift({id:uid(),date:lastMissed,title:p.title,desc:p.desc,status:'open',rerolled:false});
        if(S.penalties.length>30)S.penalties.length=30;
        log('A day was missed. Penalty quest assigned: '+p.title+'. It is a repair task, no XP was taken.');
      }
    }
  }
  S.lastEval=addDays(today,-1);
  ['done','dayClear'].forEach(function(k){Object.keys(S[k]).forEach(function(key){if(diffDays(key,today)>60)delete S[k][key]})});
  S.events=S.events.filter(function(e){return diffDays(e.date,today)<=30});
  S.chals.forEach(function(c){
    var df=CH_DEF[c.key];
    if(c.status==='active'&&c.end<today){c.status='failed';log('Challenge window ended: '+(df?df.title:'challenge')+'. No penalty. You can start it again.')}
  });
  S.chals=S.chals.filter(function(c){return c.status==='active'||diffDays(c.end,today)<=60});
  S.exams.forEach(function(e){
    if(!e.done&&e.date<today){e.done=true;var xa=gain(100,'int');addRec('special','Exam sat: '+e.name,xa,'int');log('Exam sat: '+e.name+'. +'+xa+' XP. Well done for showing up.')}
  });
  S.exams=S.exams.filter(function(e){return !e.done||diffDays(e.date,today)<=30});
  ['mdone','hday','xpDay'].forEach(function(k){Object.keys(S[k]).forEach(function(key){if(diffDays(key,today)>60)delete S[k][key]})});
}
function ensureDailyEvent(){
  var t=dkey();
  if(!S.events.some(function(e){return e.date===t}))rollEvent(true);
}
function rollEvent(auto){
  var t=dkey(),used=S.events.filter(function(e){return e.date===t}).map(function(e){return e.title});
  var pool=EVENT_POOL.filter(function(e){return used.indexOf(e.title)<0});
  if(!pool.length)return null;
  var e=Object.assign({id:uid(),date:t,t:Date.now(),status:'new'},pick(pool));
  S.events.unshift(e);
  log((auto?'A hidden event appeared: ':'Scan found an event: ')+e.title+'.');
  return e;

/* ---------- mind ---------- */
function dayAvgs(n){
  var out=[],t=dkey();
  for(var i=n-1;i>=0;i--){
    var d=addDays(t,-i),cs=S.checkins.filter(function(c){return c.date===d});
    if(!cs.length){out.push({d:d,m:null,e:null,s:null});continue}
    var av=function(k){return cs.reduce(function(a,c){return a+c[k]},0)/cs.length};
    out.push({d:d,m:av('mood'),e:av('energy'),s:av('stress')});
  }
  return out;
}
function avgOf(arr,k){var v=arr.map(function(x){return x[k]}).filter(function(x){return x!=null});return v.length?v.reduce(function(a,b){return a+b},0)/v.length:null}
function chartSvg(){
  var data=dayAvgs(14),n=data.length,W=360,H=200,L=26,R=10,T=12,B=24;
  var X=function(i){return L+i*(W-L-R)/(n-1)},Y=function(v){return T+(5-v)*(H-T-B)/4};
  var g='';
  for(var v=1;v<=5;v++)g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text x="'+(L-8)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>';
  for(var i=0;i<n;i++)if(i%3===0||i===n-1)g+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+data[i].d.slice(8)+'</text>';
  var series=[['m','s-m',''],['e','s-e','6 4'],['s','s-s','2 4']],out='';
  series.forEach(function(sr){
    var k=sr[0],path='',pen=false,last=-1;
    data.forEach(function(p,i){
      if(p[k]==null){pen=false;return}
      path+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1)+' ';pen=true;last=i;
    });
    if(!path)return;
    out+='<g class="'+sr[1]+'"><path d="'+path+'"'+(sr[2]?' stroke-dasharray="'+sr[2]+'"':'')+'/>';
    data.forEach(function(p,i){if(p[k]!=null)out+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p[k]).toFixed(1)+'" r="'+(i===last?5:2.5)+'" stroke="none"/>'});
    out+='</g>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mood, energy and stress over the last 14 days">'+g+out+'</svg>';
}
function trendLines(){
  var a=dayAvgs(14),cur=a.slice(7),prev=a.slice(0,7);
  var nc=cur.filter(function(x){return x.m!=null}).length;
  if(nc<2)return '<p class="hint">Log check-ins on at least 2 days this week to unlock weekly averages.</p>';
  var rows=[['m','Mood',true],['e','Energy',true],['s','Stress',false]].map(function(r){
    var c=avgOf(cur,r[0]),p=avgOf(prev,r[0]),ch='';
    if(c==null)return '';
    if(p!=null){var df=c-p;ch=Math.abs(df)<0.15?'steady vs last week':(df>0?'up ':'down ')+Math.abs(df).toFixed(1)+' vs last week'}
    return '<div class="chips"><span class="chip">'+r[1]+'</span><span>'+c.toFixed(1)+' / 5</span><span class="mono">'+ch+'</span></div>';
  }).join('');
  return rows;
}
function addCheckin(){

  S.checkins.push({id:uid(),date:d,t:Date.now(),mood:dr.mood,energy:dr.energy,stress:dr.stress,tags:dr.tags.slice(),note:dr.note.trim().slice(0,500)});

var breath=null;
var PH=[['Inhale',1],['Hold',1],['Exhale',.55],['Hold',.55]];
function stopBreath(silent){

      if(breath.c>=4){stopBreath(true);toolAward(15,'Box breathing');chalTick('calm');save();render();return}

}

function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes()+n.getSeconds()/60}

function span(mins){var t=Math.max(1,Math.ceil(mins)),h=Math.floor(t/60),m=t%60;return h?h+'h '+pad(m)+'m':m+' min'}
function mState(m){
  var d=dkey(),n=nowMin();

  else if(S.mdone[d]&&S.mdone[d][m.id])return 'done';

function mondayOf(k){var p=k.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);return addDays(k,-((dt.getDay()+6)%7))}

  if(S.boss&&S.boss.status==='alive')log('The '+bossDef(S.boss.id).name+' retreated. A new boss has appeared.');
  var idx=Math.floor(diffDays('2026-01-05',wk)/7);idx=((idx%BOSSES.length)+BOSSES.length)%BOSSES.length;

  S.boss={week:wk,id:b.id,hp:b.max,max:b.max,status:'alive',dmg:0};
  log('Boss appeared: '+b.name+'. Defeat it before Sunday night.');

function hitBoss(amt,stat){
  var b=S.boss;if(!b||b.status!=='alive')return;
  var def=bossDef(b.id),dmg=Math.round(amt*(def.weak.indexOf(stat)>=0?1.5:1));

}

/* special missions and bookshelf */
function curWeek(){return mondayOf(dkey())}
function spDone(sp){var r=S.special[sp.id];if(!r)return false;return sp.rep==='once'?r.n>0:r.last>=curWeek()}
function completeSpecial(id){
  var sp=allSpecial().find(function(x){return x.id===id});if(!sp||spDone(sp))return;
  var amt=gain(sp.xp,sp.stat),r=S.special[id]||{n:0,last:''};
  r.n++;r.last=dkey();S.special[id]=r;
  addRec('special',sp.title,amt,sp.stat);log('Special mission complete: '+sp.title+'. +'+amt+' XP.');
  if(sp.sk)skillLog(sp.sk[0],sp.sk[1],true);
  if(sp.court)chalTick('courage');

/* xp per day, weekly report */
function dayXp(amt,stat){
  var d=dkey(),r=S.xpDay[d]||(S.xpDay[d]={x:0,s:{}});
  r.x=Math.max(0,r.x+amt);if(stat)r.s[stat]=Math.max(0,(r.s[stat]||0)+amt);
}
function weekStats(off){
  var t=dkey(),ds=[],set={};
  for(var i=0;i<7;i++){var x=addDays(t,-(i+off));ds.push(x);set[x]=1}
  var xp=0,stat={},best={d:null,x:0};
  ds.forEach(function(x){
    var r=S.xpDay[x];if(!r)return;
    xp+=r.x;if(r.x>best.x)best={d:x,x:r.x};
    Object.keys(r.s||{}).forEach(function(k){stat[k]=(stat[k]||0)+r.s[k]});
  });
  var rc=function(ty,fn){return S.records.filter(function(r){return set[r.date]&&r.type===ty&&(!fn||fn(r))}).length};
  return {xp:xp,stat:stat,best:best,
    clear:ds.filter(function(x){return S.dayClear[x]}).length,
    missions:rc('mission'),special:rc('special'),challenges:rc('challenge'),bosses:rc('boss'),
    books:rc('book',function(r){return r.title.indexOf('Finished: ')===0}),
    courage:S.ladder.log.filter(function(l){return set[l.date]}).length,
    checkins:S.checkins.filter(function(c){return set[c.date]}).length};
}
function weeklyReport(){
  var c=weekStats(0),p=weekStats(7),a=dayAvgs(14),cur=a.slice(7),prev=a.slice(0,7);
  var mood=avgOf(cur,'m'),moodP=avgOf(prev,'m'),stress=avgOf(cur,'s'),stressP=avgOf(prev,'s'),energy=avgOf(cur,'e');
  if(c.xp===0&&p.xp===0&&!S.checkins.length)return panel('Weekly Report','<p style="margin:0">Your report appears here once you have a few days of activity. It compares your last 7 days with the 7 before.</p>','','<span class="mono">Last 7 days</span>');
  var vs=function(x,y,u){if(y==null)return '';var df=Math.round((x-y)*10)/10;return df===0?' (same as the week before)':' ('+(df>0?'up ':'down ')+Math.abs(df)+(u||'')+' on the week before)'};
  var topK=null,lowK=null,mx=-1,mn=1e9;
  Object.keys(STAT).forEach(function(k){var v=c.stat[k]||0;if(v>mx){mx=v;topK=k}if(v<mn){mn=v;lowK=k}});
  var rows='<li><time>XP</time><span>'+c.xp+vs(c.xp,p.xp)+'</span></li>'+
    '<li><time>Daily quests</time><span>cleared on '+c.clear+' of 7 days</span></li>'+
    '<li><time>Missions</time><span>'+c.missions+' timed, '+c.special+' special, '+c.challenges+' challenge'+(c.challenges===1?'':'s')+(c.bosses?', '+c.bosses+' boss defeated':'')+'</span></li>'+
    '<li><time>Courage</time><span>'+c.courage+' ladder step'+(c.courage===1?'':'s')+'</span></li>'+
    (c.books?'<li><time>Books</time><span>'+c.books+' finished</span></li>':'')+
    '<li><time>Mood</time><span>'+(mood!=null?mood.toFixed(1)+' / 5'+vs(mood,moodP):'no check-ins yet')+'</span></li>'+
    (energy!=null?'<li><time>Energy</time><span>'+energy.toFixed(1)+' / 5</span></li>':'')+
    (stress!=null?'<li><time>Stress</time><span>'+stress.toFixed(1)+' / 5'+vs(stress,stressP)+'</span></li>':'')+
    (c.best.d?'<li><time>Best day</time><span>'+esc(c.best.d)+' with '+c.best.x+' XP</span></li>':'')+
    (mx>0?'<li><time>Top stat</time><span>'+STAT[topK].ab+' '+STAT[topK].n+' (+'+mx+' XP)</span></li>':'');
  var good=[],next=[];
  if(c.clear>=5)good.push('You cleared your daily quests on '+c.clear+' days.');
  if(c.missions>=10)good.push('You completed '+c.missions+' timed missions.');
  if(mood!=null&&moodP!=null&&mood>moodP+0.2)good.push('Your mood is trending up.');
  if(stress!=null&&stressP!=null&&stress<stressP-0.2)good.push('Your stress went down.');
  if(c.courage>0)good.push('You took '+c.courage+' courage step'+(c.courage===1?'':'s')+'. That is the hardest training here.');
  if(c.books>0)good.push('You finished a book.');
  if(p.xp>0&&c.xp>p.xp)good.push('Your XP is up on the week before.');
  if(!good.length)good.push('You showed up and kept the record. Every logged day counts.');
  if(c.checkins<3)next.push('Log a check-in on at least 3 days so your mood trend means something.');
  if(c.clear<4)next.push('Use Low-Energy Mode on hard days so your streak survives.');
  if(c.courage===0)next.push('Try one Courage Ladder step. Step 1 is just a nod.');
  if(stress!=null&&stress>=3.5)next.push('Stress ran high. Do a breathing round before study or matches.');
  if(!c.missions)next.push('Open Missions and catch the next window.');
  if(mx>0&&lowK&&lowK!==topK)next.push('Your quietest area was '+STAT[lowK].ab+' '+STAT[lowK].n+'. Pick one mission to lift it.');
  var li=function(arr){return arr.slice(0,3).map(function(t){return '<li style="margin:4px 0">'+esc(t)+'</li>'}).join('')};
  return panel('Weekly Report','<ul class="log">'+rows+'</ul><div class="sub">What went well</div><ul style="margin:6px 0 0;padding-left:18px">'+li(good)+'</ul>'+(next.length?'<div class="sub">Focus for next week</div><ul style="margin:6px 0 0;padding-left:18px">'+li(next)+'</ul>':''),'','<span class="mono">Last 7 days</span>');
}

/* exam mode */
function examDays(e){return diffDays(dkey(),e.date)}
function examPhase(n){return n<0?'DONE':n===0?'EXAM DAY':n===1?'THE EVE':n<=7?'FINAL WEEK':n<=21?'DRILL':'BUILD'}
function examTarget(n){return n<=1?0:n<=21?2:1}
function examAdvice(n){
  if(n===0)return 'Eat, breathe slowly for one minute and trust your preparation. Use the same calm routine you would before a match.';
  if(n===1)return 'Light review for 30 minutes at most, pack your things and sleep early. No cramming.';
  if(n<=7)return 'Past papers and weak spots only. Protect your sleep and eat properly.';
  if(n<=21)return 'Practise under pressure. Two blocks a day and one timed past paper each week.';
  return 'Learn the material. One focused block a day, then test yourself without notes.';
}
function nearestExam(){
  var best=null;
  S.exams.forEach(function(e){var n=examDays(e);if(n>=0&&(!best||n<examDays(best)))best=e});
  return best;
}
function examNote(){
  var e=nearestExam();if(!e)return '';
  var n=examDays(e);if(n>28)return '';
  return ' Exam in '+n+' day'+(n===1?'':'s')+': '+e.name+'.';
}
function examBump(e){
  if(!e)return;

    stepsHtml+

    (hist?'<div class="sub">Recent</div><ul class="log">'+hist+'</ul>':'')+
    '<p class="hint">Up to 2 steps a day earn XP. If anxiety feels overwhelming or gets in the way of daily life, a counsellor or doctor can help. Many schools and universities offer free support.</p>');
  var sod=skillOfDay();
  var skills=panel('Skills',
    '<p style="margin:0;color:var(--mute)">Log your practice time. Every 90 minutes is a skill level. Skill of the day: <b style="color:var(--ink)">'+esc(sod.name)+'</b>, used by the Skill Forge mission. Skill XP is capped at 60 a day.</p>'+
    S.skills.map(function(s){
      var lvl=skLevel(s),into=(s.min||0)%90;
      return '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><h3>'+esc(s.name)+' <span class="chip now">LV '+lvl+'</span></h3>'+(S.skills.length>1?'<button class="lnk" data-act="skdel" data-id="'+s.id+'">remove</button>':'')+'</div><div class="prog"><div class="bar"><i style="width:'+Math.round(into/90*100)+'%"></i></div><span class="mono">'+(s.min||0)+' min total</span></div><div class="row" style="margin-top:10px"><button class="btn sm" data-act="skadd" data-id="'+s.id+'" data-v="10">+10 min</button><button class="btn sm" data-act="skadd" data-id="'+s.id+'" data-v="15">+15 min</button><button class="btn sm" data-act="skadd" data-id="'+s.id+'" data-v="25">+25 min</button></div></div>';
    }).join('')+
    '<div class="form" style="margin-top:14px"><div><label class="lab" for="skN">Add a skill</label><input id="skN" class="inp" maxlength="40" placeholder="e.g. Drawing, Maths, Guitar" value="'+esc(UI.sk.name)+'" data-bind="sk.name"></div><div><button class="btn sm" data-act="skcreate">Add skill</button></div></div>');
  var tips=panel('Student Toolkit',
    '<div class="card" style="margin-top:0"><h3>Active recall</h3><p>Close the book and write what you remember, then check. It beats rereading.</p></div>'+
    '<div class="card"><h3>25 and 5</h3><p>25 minutes on one task, 5 minutes off. Use the Focus Dungeon in Quests.</p></div>'+
    '<div class="card"><h3>Spaced review</h3><p>Revisit new material after 1 day, 3 days and 7 days. Ten minutes each time is enough.</p></div>'+
    '<div class="card"><h3>Teach it back</h3><p>Explain a topic out loud in simple words, even to an empty room. Gaps show up fast.</p></div>');
  var plan=panel('No-Gym Week',
    '<p style="margin:0;color:var(--mute)">The Home Training mission follows this plan. Everything is doable at home with no equipment.</p><ul class="log" style="margin-top:8px">'+[1,2,3,4,5,6,0].map(function(i){return '<li><time>'+DAYN[i].slice(0,3)+(i===new Date().getDay()?' (today)':'')+'</time><span>'+esc(TRAIN[i])+'</span></li>'}).join('')+'</ul>');
  return '<div class="grid2"><div>'+ladder+'</div><div>'+skills+tips+plan+'</div></div>';

function modalHtml(){

/* ---------- render ---------- */
function render(){
  if(UI.view!=='mind')stopBreath(true);
  $('#app').innerHTML=VIEWS[UI.view]();
  $('#modal').innerHTML=modalHtml();
  stampKeys();lastSig=mSig();
  document.querySelectorAll('.tab').forEach(function(t){if(t.dataset.v===UI.view)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current')});
  if(UI.modal){var ok=$('#modalOk');if(ok)ok.focus()}
  else if(lastKey){var n=document.querySelector('[data-key="'+lastKey+'"]');if(n)n.focus({preventScroll:true})}
  tick(true);
}
function keyOf(el){
  var d=el.dataset;return d.act?d.act+'|'+(d.id||'')+'|'+(d.m||'')+'|'+(d.k||'')+'|'+(d.v||'')+'|'+(d.i||''):null;
}
function stampKeys(){
  document.querySelectorAll('[data-act]').forEach(function(el){el.setAttribute('data-key',keyOf(el))});
}

/* ---------- actions ---------- */
function act(a,el){
  var d=el.dataset;
  switch(a){
    case 'tab':UI.view=d.v;lastKey=null;UI.confirmReset=false;render();window.scrollTo(0,0);return;
    case 'closemodal':UI.modal=null;render();return;
    case 'qtoggle':toggleQuest(d.id);return;
    case 'qremove':{
      var q=S.quests.find(function(x){return x.id===d.id});if(!q)return;
      if(q.custom)S.quests=S.quests.filter(function(x){return x.id!==d.id});else q.hidden=true;
      log('Quest removed: '+q.title+'.');recheck();save();render();return;
    }
    case 'qrestore':S.quests.forEach(function(q){q.hidden=false});recheck();save();render();return;
    case 'qadd':{
      var t=UI.qd.title.trim();if(!t){toast('Give the quest a name first.');return}
      var xp={min:15,core:25,bonus:20}[UI.qd.tier];
      S.quests.push({id:'c_'+uid(),title:t,desc:'Custom quest.',stat:UI.qd.stat,xp:xp,tier:UI.qd.tier,w:UI.qd.w,custom:true});
      log('Quest added: '+t+'.');UI.qd.title='';recheck();save();render();return;
    }
    case 'mode':
      S.lowMode=d.v==='low';
      log(S.lowMode?'Low-Energy Mode on. Only base quests are required.':'Normal Mode on.');
      toast(S.lowMode?'Low-Energy Mode on. Be gentle with yourself.':'Normal Mode on.');
      recheck();save();render();return;
    case 'pclear':{
      var p=openPenalty();if(!p)return;
      p.status='done';S.penCleared++;var g=gain(15,'agi');
      log('Penalty cleared: '+p.title+'. +'+g+' XP. Repair complete.');toast('Penalty cleared. +'+g+' XP');save();render();return;
    }
    case 'preroll':{
      var pp=openPenalty();if(!pp||pp.rerolled)return;
      var c=PEN_POOL.filter(function(x){return x.title!==pp.title}),n=pick(c);
      pp.title=n.title;pp.desc=n.desc;pp.rerolled=true;log('Penalty swapped to: '+n.title+'.');save();render();return;
    }
    case 'focusstart':startFocus();return;
    case 'focusstop':stopFocus();return;
    case 'gadd':{
      var title=UI.gd.title.trim();if(!title){toast('Give the goal a name first.');return}
      var ms=UI.gd.ms.split('\n').map(function(s){return s.trim()}).filter(Boolean).slice(0,12);
      if(!ms.length)ms=['Take the first small step'];
      S.goals.unshift({id:uid(),title:title,cat:UI.gd.cat,created:dkey(),due:UI.gd.due||'',bonus:0,ms:ms.map(function(t){return {id:uid(),t:t.slice(0,120),done:false,xp:0}})});
      log('Gate opened: '+title+'.');UI.gd={title:'',cat:UI.gd.cat,ms:'',due:''};save();render();return;
    }
    case 'gms':toggleMs(d.id,d.m);return;
    case 'gdel':{
      var gg=S.goals.find(function(x){return x.id===d.id});S.goals=S.goals.filter(function(x){return x.id!==d.id});
      if(gg)log('Gate removed: '+gg.title+'.');save();render();return;
    }
    case 'escan':{
      var left=S.lastScan+30*60000-Date.now(),cnt=S.events.filter(function(e){return e.date===dkey()}).length;
      if(left>0||cnt>=3)return;
      S.lastScan=Date.now();var e=rollEvent(false);
      toast(e?'Event found: '+e.title:'No new events right now.');save();render();return;
    }
    case 'eaccept':{
      var ev=S.events.find(function(x){return x.id===d.id});if(!ev)return;
      ev.status='active';
      if(ev.kind==='buff'){S.buff={date:dkey(),mult:ev.mult};toast('Bonus x'+ev.mult+' active until midnight.')}
      log('Event accepted: '+ev.title+'.');save();render();return;
    }
    case 'edone':{
      var e2=S.events.find(function(x){return x.id===d.id});if(!e2||e2.status!=='active')return;
      e2.status='done';var ga=gain(e2.xp,e2.stat);log('Event cleared: '+e2.title+'. +'+ga+' XP.');toast('Event cleared. +'+ga+' XP');save();render();return;
    }
    case 'eskip':{
      var e3=S.events.find(function(x){return x.id===d.id});if(!e3)return;
      if(e3.kind==='buff'&&S.buff&&S.buff.date===e3.date)S.buff=null;
      e3.status='skipped';log('Event skipped: '+e3.title+'. No penalty.');save();render();return;
    }
    case 'pick':UI.draft[d.k]=Number(d.v);render();return;
    case 'tag':{var i=UI.draft.tags.indexOf(d.v);if(i>=0)UI.draft.tags.splice(i,1);else UI.draft.tags.push(d.v);render();return}
    case 'checkin':addCheckin();return;
    case 'bstart':startBreath();render();paintBreath();return;
    case 'bstop':stopBreath(false);return;
    case 'gr':UI.gr[Number(d.i)]=el.checked;{var b=$('[data-act="grdone"]');if(b)b.disabled=!UI.gr.every(Boolean)}return;
    case 'grdone':if(!UI.gr.every(Boolean))return;UI.gr=[false,false,false,false,false];toolAward(10,'Grounding');save();render();return;
    case 'rfsave':{
      var r=UI.rf;if(!r.a.trim()||!r.c.trim()){toast('Add the thought and a fairer version first.');return}
      S.reframes.unshift({id:uid(),t:Date.now(),a:r.a.trim().slice(0,300),b:r.b.trim().slice(0,300),c:r.c.trim().slice(0,300)});
      if(S.reframes.length>30)S.reframes.length=30;
      UI.rf={a:'',b:'',c:''};toolAward(20,'Thought reframe');save();render();return;
    }
    case 'copybk':{
      var txt=JSON.stringify(S);
      var fallback=function(){UI.backup=txt;render();var ta=$('#bkIn');if(ta){ta.focus();ta.select()}toast('Copy blocked. The backup is in the box; select and copy it.')};
      try{navigator.clipboard.writeText(txt).then(function(){toast('Backup copied to clipboard.')},fallback)}catch(err){fallback()}
      return;
    }
    case 'restore':{
      try{var o=JSON.parse(UI.backup);if(!o||o.v!==1||!Array.isArray(o.quests))throw new Error('bad');
        S=normalize(o);UI.backup='';ensureBoss();log('Progress restored from backup.');recheck();save();render();toast('Backup restored.');
      }catch(err){toast('That text is not a valid backup.')}
      return;
    }
    case 'resetask':UI.confirmReset=true;render();return;
    case 'resetno':UI.confirmReset=false;render();return;
    case 'resetgo':S=defaultState();ensureBoss();checkSchedule();UI.confirmReset=false;UI.modal=null;save();render();toast('Progress reset. A fresh start.');return;
    case 'bgo':UI.view=d.v;UI.banner=null;paintBanner();lastKey=null;render();window.scrollTo(0,0);return;
    case 'bclose':UI.banner=null;paintBanner();return;
    case 'mdo':completeMission(d.id);return;
    case 'altog':S.alerts[d.v]=!S.alerts[d.v];if(S.alerts.sound)unlockAudio();if(d.v==='wake')setWake(S.alerts.wake);save();render();return;
    case 'altest':unlockAudio();showBanner('Test alert','This is how a new mission will look and sound.','missions');return;
    case 'chstart':{
      if(chalActive().length>=2){toast('Two challenges at a time is the limit.');return}
      var cdf=CH_DEF[d.id];if(!cdf)return;
      S.chals.unshift({id:uid(),key:d.id,start:dkey(),end:addDays(dkey(),cdf.days-1),days:{},count:0,status:'active'});
      log('Challenge started: '+cdf.title+'.');toast('Challenge started: '+cdf.title);save();render();return;
    }
    case 'chlog':{
      var ch1=S.chals.find(function(x){return x.id===d.id});if(!ch1||ch1.status!=='active')return;
      var cdf2=CH_DEF[ch1.key],kk=dkey();
      if(cdf2.mode==='daily'){if(ch1.days[kk])return;ch1.days[kk]=1;ch1.count++}else ch1.count++;
      chalCheck(ch1);save();render();return;
    }
    case 'chquit':S.chals=S.chals.filter(function(x){return x.id!==d.id});log('Challenge dropped. No penalty.');save();render();return;
    case 'ladopen':UI.lad.open=d.id;UI.lad.before='5';UI.lad.after='5';render();return;
    case 'ladcancel':UI.lad.open=null;render();return;
    case 'ladsave':ladSave(d.id);return;
    case 'ladadd':{
      var ltx=UI.lad.custom.trim();if(!ltx){toast('Describe the step first.');return}
      S.ladder.steps.push({id:'lc_'+uid(),t:ltx.slice(0,100),s:'Your own step. Pick a size that feels challenging but doable.',custom:1});
      UI.lad.custom='';save();render();return;
    }
    case 'skadd':skillLog(d.id,Number(d.v),false);save();render();return;
    case 'skcreate':{
      var snm=UI.sk.name.trim();if(!snm){toast('Name the skill first.');return}
      if(S.skills.length>=10){toast('Ten skills is the limit.');return}
      S.skills.push({id:'c_'+uid(),name:snm.slice(0,40),min:0});UI.sk.name='';save();render();return;
    }
    case 'skdel':if(S.skills.length>1){S.skills=S.skills.filter(function(x){return x.id!==d.id});save();render()}return;
    case 'hf':UI.hf=d.v;render();return;
    case 'sf':UI.sf=d.v;render();return;
    case 'dtype':S.dayType={date:dkey(),type:d.v};log('Football day set: '+d.v+'.');save();render();return;
    case 'csadd':{
      var cst=UI.cs.title.trim();if(!cst){toast('Name the mission first.');return}
      if(S.customSpecial.length>=15){toast('Fifteen own missions is the limit.');return}
      S.customSpecial.push({id:'cs_'+uid(),cat:UI.cs.cat,title:cst.slice(0,70),desc:'Your own mission.',stat:UI.cs.stat,xp:Number(UI.cs.xp)||35,rep:UI.cs.rep,custom:1});
      UI.cs.title='';save();render();return;

    case 'exadd':{
      var exn=UI.ex.name.trim(),exd=UI.ex.date;

    case 'bkgot':{
      var bg=allBooks().find(function(x){return x.id===d.id});if(!bg||bkState(d.id).st!=='wish')return;

    case 'bkstart':{var bs=allBooks().find(function(x){return x.id===d.id});if(!bs)return;bkSet(d.id,{st:'reading'});log('Started reading: '+bs.t+'.');save();render();return}
    case 'bklog':{
      var bl=allBooks().find(function(x){return x.id===d.id});if(!bl)return;
      var bm=Number(d.v);bkSet(d.id,{min:(bkState(d.id).min||0)+bm});skillLog('read',bm,false);
      log('Read '+bm+' minutes of '+bl.t+'.');save();render();return;

    case 'bkfin':UI.bk.open=d.id;UI.bk.note='';render();return;
    case 'bkcancel':UI.bk.open=null;render();return;
    case 'bkfinsave':{
      var bf=allBooks().find(function(x){return x.id===d.id});if(!bf)return;
      var bst=bkState(d.id);
      if((bst.min||0)<120){toast('Log at least 120 minutes of reading first. You have '+(bst.min||0)+'.');return}
      if(UI.bk.note.trim().length<5){toast('Write one or two lines about what you took away.');return}
      var sb=statVal(bf.st),gf=gain(150,bf.st),sa=statVal(bf.st);
      bkSet(d.id,{st:'done',note:UI.bk.note.trim().slice(0,300)});
      addRec('book','Finished: '+bf.t,gf,bf.st);
      log('Book finished: '+bf.t+'. +'+gf+' XP, +'+(sa-sb)+' '+STAT[bf.st].ab+'.');
      toast('Book finished: '+bf.t+'. +'+gf+' XP and +'+(sa-sb)+' '+STAT[bf.st].ab);
      showBanner('Book finished',bf.t+' is on your record. +'+(sa-sb)+' '+STAT[bf.st].ab+'.','special');
      UI.bk.open=null;save();render();return;
    }
    case 'bkadd':{
      var bt=UI.bk.title.trim();if(!bt){toast('Enter the book title first.');return}
      if(S.customBooks.length>=10){toast('Ten own books is the limit.');return}
      S.customBooks.push({id:'cb_'+uid(),t:bt.slice(0,80),a:UI.bk.author.trim().slice(0,60)||'Unknown author',st:'int',d:'Your own pick.',custom:1});
      UI.bk.title='';UI.bk.author='';save();render();return;
    }
  }
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='INPUT'&&el.type==='checkbox')return;
  lastKey=el.getAttribute('data-key');
  act(el.dataset.act,el);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.act==='gr'){act('gr',el);return}
  if(el.dataset&&el.dataset.change==='name'){S.name=el.value.trim().slice(0,24)||'Player';log('Name set to '+S.name+'.');save()}
});
document.addEventListener('input',function(e){
  var el=e.target,p=el.dataset&&el.dataset.bind;if(!p)return;
  var parts=p.split('.');
  if(parts.length===2)UI[parts[0]][parts[1]]=el.value;else UI[parts[0]]=el.value;
});

/* ---------- clock ---------- */
function tick(force){
  var n=new Date();
  var c=$('#clock');if(c)c.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
  var dt=$('#dateTxt');if(dt)dt.textContent=n.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'});
  var mid=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),ms=mid-n,r=$('#resetIn');
  if(r)r.textContent=Math.floor(ms/3600000)+'h '+pad(Math.floor(ms%3600000/60000))+'m';
  if(force)return;
  if(dkey()!==curDay){curDay=dkey();evaluate();ensureBoss();checkSchedule();recheck();save();render();return}
  if(S.timer){
    if(Date.now()>=S.timer.end){checkFocus();return}
    var f=$('#focusClock');if(f)f.textContent=fmtClock(S.timer.end-Date.now());
  }
  checkSchedule();updateCountdowns();
}

/* ---------- boot ---------- */
var started=false;
function boot(){
  evaluate();ensureBoss();checkSchedule();recheck();
  if(S.timer&&Date.now()>=S.timer.end)checkFocus();
  save();render();
  started=true;
}
boot();
setInterval(function(){tick(false)},1000);
initDb();
})();
</script>
